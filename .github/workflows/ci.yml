name: ci

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always
  CARGO: "Cargo.toml"

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "Cargo.toml"
      - ".github/workflows/ci.yml"

jobs:
  pre:
    runs-on: ubuntu-latest
    outputs:
      path: ${{ env.CARGO }}
    steps:
      - run: echo "Bypass GitHub Action Restriction"

  release:
    needs:
      - pre
    uses: AUTOM77/Rust-Actions/.github/workflows/release.yml
    with:
      path: ${{ needs.pre.outputs.path }}
    secrets: inherit